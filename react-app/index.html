    // --- 2. Main ABHA React Application Component ---
    function App() {
      const [products] = useState(PRODUCTS_DATA);
      
      // Page Routing: { type: 'home' } or { type: 'category', categoryId: 'panjabi' }
      const [currentPage, setCurrentPage] = useState({ type: 'home' });

      const [activeCategory, setActiveCategory] = useState('all');
      const [activeSort, setActiveSort] = useState('popular');
      const [searchQuery, setSearchQuery] = useState('');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      // Right-to-Left Product Slider Mode vs Grid Mode
      const [displayMode, setDisplayMode] = useState('slider'); // 'slider' | 'grid'
      const [isAutoScrollPaused, setIsAutoScrollPaused] = useState(false);

      // Hero Interactive Look Selector with 5-second automatic slider
      const [activeHeroLook, setActiveHeroLook] = useState(0);

      useEffect(() => {
        const heroTimer = setInterval(() => {
          setActiveHeroLook((prev) => (prev + 1) % 3);
        }, 5000);
        return () => clearInterval(heroTimer);
      }, []);

      // Cart & Wishlist State
